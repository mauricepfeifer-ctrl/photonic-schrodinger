<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Empire Mission Control</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-up {
            background: #166534;
            color: #4ade80;
        }

        .status-down {
            background: #991b1b;
            color: #f87171;
        }

        .status-unknown {
            background: #854d0e;
            color: #facc15;
        }

        .details {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .port {
            font-family: monospace;
        }

        .kpi-row {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            flex: 1;
            background: #0f172a;
            border: 1px solid #38bdf8;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: bold;
            color: #f0f9ff;
            display: block;
        }

        .kpi-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #7dd3fc;
        }

        .refresh-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            background: #7dd3fc;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Mission Control // AI Empire</h1>

        <div class="kpi-row">
            <div class="kpi-card">
                <span class="kpi-value">Active</span>
                <span class="kpi-label">System Status</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-value">$0.00</span>
                <span class="kpi-label">Daily Revenue</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-value">0</span>
                <span class="kpi-label">Active Agents</span>
            </div>
        </div>

        <button onclick="loadStatus()" class="refresh-btn">Refresh Status</button>
        <div id="services-grid" class="grid">
            <!-- Services will be injected here -->
            <div class="card">
                <h2>Loading...</h2>
            </div>
        </div>
    </div>

    <script>
        async function loadStatus() {
            try {
                // In a real scenario, this would fetch from a live endpoint. 
                // Since this is a local file dashboard, we read status.json generated by the script.
                const response = await fetch('status.json?t=' + new Date().getTime());
                const data = await response.json();

                const grid = document.getElementById('services-grid');
                grid.innerHTML = '';

                data.forEach(service => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    const isUp = service.status === 'UP';
                    const statusClass = isUp ? 'status-up' : 'status-down';

                    card.innerHTML = `
                        <h2>
                            ${service.name}
                            <span class="status-badge ${statusClass}">${service.status}</span>
                        </h2>
                        <div class="details">
                            <div>Port: <span class="port">${service.port || 'N/A'}</span></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('services-grid').innerHTML = '<div class="card" style="border-color: red"><h2>Error loading status.json</h2><p>Run <code>./scripts/mc_status.sh --json > dashboard/status.json</code></p></div>';
            }
        }

        loadStatus();
        // Auto refresh every 30s
        setInterval(loadStatus, 30000);
    </script>
</body>

</html>
